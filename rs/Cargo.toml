[package]
name = "additive-fft-reed-solomon"
version = "0.3.2"
license = "MIT"
description = "Fast Reed-Solomon encode and decode algorithms based on additive FFT (Lin, Al Naffouri, Han)"
repository = "https://github.com/vkomenda/additive-fft-reed-solomon"
readme = "../README.md"
keywords = ["Reed-Solomon", "erasure", "error-correcting", "FEC", "FFT"]
categories = ["encoding"]
edition = "2024"

[dependencies]
additive-fft-reed-solomon-gf2p8 = { path = "../gf2p8", version = "0.2.1" }
cfg-if = "1.0"

[build-dependencies]
additive-fft-reed-solomon-gf2p8 = { path = "../gf2p8", version = "0.2.1" }

[dev-dependencies]
criterion = "0.8"
rand = "0.10"

[[test]]
name = "rse_compat"
required-features = ["unstable-internals"]

[profile.bench]
inherits = "release"
lto = "fat"
codegen-units = 1

[[bench]]
name = "encode_systematic_sharded"
harness = false
required-features = ["unstable-internals"]

[[bench]]
name = "locator_log_evals"
harness = false
required-features = ["unstable-internals"]

[[bench]]
name = "recover_erasures_sharded"
harness = false
required-features = ["unstable-internals"]

[[bench]]
name = "recover_erasures_sharded_clobber"
harness = false
required-features = ["unstable-internals"]

[[bench]]
name = "transform"
harness = false
required-features = ["unstable-internals"]

[features]
default = []
# Exposes internal modules for benches. Not public API: no stability guarantees.
unstable-internals = []
